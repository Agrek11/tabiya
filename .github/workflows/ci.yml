name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

  catalog:
    name: Python catalog build (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python deps
        working-directory: scripts/tabiya_build
        run: uv sync --all-extras
        continue-on-error: true

      - name: Ruff lint
        working-directory: scripts/tabiya_build
        run: uv run ruff check .
        continue-on-error: true

      - name: Pytest
        run: uv run --directory scripts/tabiya_build pytest ../../tests/python
        continue-on-error: true

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile -t tabiya/frontend:ci .
