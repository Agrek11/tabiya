[project]
name = "tabiya-build"
version = "0.1.0"
description = "Offline catalog builder for tabiya — fetches Lichess openings TSV + Explorer API and emits public/catalog.json"
requires-python = ">=3.12"
dependencies = [
  "chess>=1.10",
  "httpx>=0.27",
  "pydantic>=2.7",
  "tenacity>=8.4",
  "PyYAML>=6.0",
  "truststore>=0.10",
  # Phase 1b — Explain Mode authoring pipeline (Article 1: permissive licenses).
  # Build-time only; never ship in the frontend bundle (Article 16).
  "anthropic>=0.40",   # MIT — direct SDK call, no LangChain (Article 3)
  "jinja2>=3.1",       # BSD-3 — prompt templating
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-mock>=3.14",
  "ruff>=0.5",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-mock>=3.14",
  "ruff>=0.5",
]

[project.scripts]
tabiya-build = "scripts.build_catalog:main"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/.cache", "tests/python/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]   # bugbear false positives common in tests

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q --cov=scripts.tabiya_build --cov-report=term-missing"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/tabiya_build"]
