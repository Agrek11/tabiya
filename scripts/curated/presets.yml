# Curated repertoire presets — one-click loadouts.
#
# Phase 1.5 schema: each preset now declares an explicit `lines:` array.
# When `lines` is non-empty, the Phase 1.5 `computeEffectivePick` resolver
# treats it as authoritative. When `lines` is empty, the legacy tier/family
# derivation is used (R5.1 fallback).
#
# `tier_band` + `family_ids` are retained — older versions of the catalog
# loader (and the `usePreset` migration path) still read them.
#
# `id: off` is a synthetic preset id with `lines: []` meaning "no filter"
# (R5.9). It is NOT shipped in this YAML; it is constructed in code.
#
# `scripts/validate_presets.py` asserts every line ID listed below exists
# in `public/catalog.json`.

presets:
  - id: beginner
    name: Beginner
    description: Solid, low-theory openings. Great starting point.
    tier_band: [1]
    family_ids:
      - london
      - caro-kann
      - italian
    lines:
      - london-modern-main
      - london-anti-kid-main
      - caro-kann-classical-main
      - caro-kann-advance-main
      - italian-giuoco-pianissimo-main
    recommended_color: both

  - id: intermediate
    name: Intermediate
    description: Classical mainlines covering ~70% of club games.
    tier_band: [1, 2]
    family_ids: []
