# Curated families — Tier 1 = must-have, Tier 2 = common, Tier 3 = offbeat.
#
# Tier 1 covers ~70% of all club games. Tier 2 covers next ~20%. Tier 3 is
# the long tail (BDG, Polish, Grob etc) — included for completeness but not
# drilled in default presets.
#
# Each family has 1-4 child variations declared in variations.yml.

families:
  # ── Tier 1: open games (1.e4 e5) ──────────────────────────────
