# Hand-curated strategic notes + key squares per line.
#
# Schema:
#   <line-id>:
#     strategic_notes:
#       - "Short sentence about the plan / structure / key idea"
#     key_squares:
#       - { square: d5, note: "...", side: white | black | both, role: outpost | weak | target | break | tension | control | pivot }
#
# Roles drive spotlight color (Phase 2b):
#   outpost  → green       (safely held square in enemy half, knight-friendly)
#   weak     → amber       (square opponent cannot defend with a pawn)
#   target   → red         (weak pawn or known tactical pressure point)
#   break    → magenta     (pawn-break destination / lever square)
#   tension  → orange      (central square where pawns/pieces clash)
#   control  → blue        (influenced but not occupied — strategic sphere)
#   pivot    → violet      (piece reroute hub)
#
# Notes are merged into the catalog in `scripts/tabiya_build/notes.py`.
# Missing line ids are skipped with a warning. Empty file is valid.
# Max 5 key_squares per line; `note` ≤80 chars.

