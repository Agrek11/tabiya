# Phase 2a — Few-shot exemplars for the key-squares extractor.
#
# Five hand-authored exemplars covering all four roles in the taxonomy:
#   outpost  — long-term piece anchor that the opponent cannot easily contest
#   control  — central squares whose occupation/contest decides the plan
#   tension  — squares where opposing pawns/pieces interact at imbalance
#   weak     — squares the defender cannot easily protect long-term
#
# Tuning is data-only — edit this file to adjust extractor behavior. Pydantic
# validates each `output` entry on load (test_extract.py); a malformed
# exemplar fails the test before reaching production.

exemplars:
  - opening_slug: italian-game-main
    opening_name: "Italian Game, Main Line"
    fen_canonical: "r1bqkb1r/pppp1ppp/2n2n2/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4"
    prose: |
      The Italian Game targets f7 — Black's weakest square in the opening,
      defended only by the king. The bishop on c4 + knight on g5 combine in
      the Fried Liver. Central control via d2-d4 break opens the c4 bishop.
    output:
      - square: f7
        role: weak
        for_color: black
        rationale: "f7 defended only by the king; Bc4 + Ng5 ideas (Fried Liver) hit this square."
        source_url: "https://en.wikipedia.org/wiki/Italian_Game"
      - square: d5
        role: control
        for_color: white
        rationale: "Central break d2-d4 contests Black's e5 and opens the c4 bishop diagonal."
        source_url: "https://en.wikipedia.org/wiki/Italian_Game"

  - opening_slug: ruy-lopez-closed-main
    opening_name: "Ruy López, Closed Variation"
    fen_canonical: "r1bq1rk1/2pnbppp/p2p1n2/1p2p3/3PP3/1BP2N1P/PP3PP1/RNBQR1K1 w - - 0 9"
    prose: |
      White's Spanish bishop on b3 jointly with the f3 knight pressures d5;
      the d3-d4 break is thematic. White reroutes the b1 knight via d2-f1-g3,
      sometimes landing on f5. Black's queenside expansion ...c5 contests d4.
    output:
      - square: d5
        role: control
        for_color: white
        rationale: "Central square White's b3 bishop and f3 knight jointly pressure; key for d3-d4 break."
        source_url: "https://en.wikipedia.org/wiki/Ruy_Lopez"
      - square: f5
        role: outpost
        for_color: white
        rationale: "Knight reroute Nb1-d2-f1-g3 lands on f5 — Black struggles to dislodge with pawns."
        source_url: "https://en.wikipedia.org/wiki/Ruy_Lopez"

  - opening_slug: queens-gambit-declined-main
    opening_name: "Queen's Gambit Declined, Main Line"
    fen_canonical: "r1bq1rk1/pp3ppp/2n1pn2/2pp4/2PP4/2NBPN2/PP3PPP/R1BQK2R w KQ - 0 8"
    prose: |
      The d5 square is the QGD pivot — White's c4 pawn pressures it,
      Black defends with ...e6. The e4 break for White and the ...c5
      break for Black define the middlegame plans. The minority attack
      on the queenside targets Black's c6 pawn after b2-b4-b5.
    output:
      - square: d5
        role: tension
        for_color: black
        rationale: "QGD pivot — Black's d5 holds vs c4 pressure; collapse to dxc4 hands White an isolated pawn or e4 break."
        source_url: "https://en.wikipedia.org/wiki/Queen%27s_Gambit_Declined"
      - square: c6
        role: weak
        for_color: black
        rationale: "Minority attack target — after b2-b4-b5 White creates a backward c6 pawn that anchors a queenside plan."
        source_url: "https://en.wikipedia.org/wiki/Queen%27s_Gambit_Declined"

  - opening_slug: sicilian-najdorf-main
    opening_name: "Sicilian Defense, Najdorf Variation"
    fen_canonical: "rnbqkb1r/1p2pppp/p2p1n2/8/3NP3/2N5/PPP2PPP/R1BQKB1R w KQkq - 0 6"
    prose: |
      ...a6 prepares ...e5 or ...b5. The d5 square is the perennial Sicilian
      fight — if Black can land a knight on d5 the position equalises; if
      White can plant a piece there permanently, Black is positionally
      lost. Black's d6 pawn is the structural weakness White probes.
    output:
      - square: d5
        role: tension
        for_color: black
        rationale: "Sicilian fight square — Black aims to land a knight; White prevents and exploits the hole."
        source_url: "https://en.wikipedia.org/wiki/Sicilian_Defence,_Najdorf_Variation"
      - square: d6
        role: weak
        for_color: black
        rationale: "Backward d6 pawn — White probes with Rd1, Nd5, and pressure builds slowly along the file."
        source_url: "https://en.wikipedia.org/wiki/Sicilian_Defence,_Najdorf_Variation"

  - opening_slug: kings-indian-mainline
    opening_name: "King's Indian Defense, Mar del Plata Variation"
    fen_canonical: "r1bq1rk1/ppp1npbp/3p1np1/3Pp3/2P1P3/2N2N2/PP2BPPP/R1BQ1RK1 w - - 0 8"
    prose: |
      Mar del Plata: White attacks the queenside with c4-c5 while Black storms
      the kingside with ...f5-f4-g5. The c5 outpost anchors White's plan;
      the f4 outpost anchors Black's. The e4 square is the structural pivot;
      whoever loses control of e4 loses the game.
    output:
      - square: c5
        role: outpost
        for_color: white
        rationale: "Mar del Plata pivot — White's c4-c5 break anchors a queenside attack via cxd6 and b2-b4-b5."
        source_url: "https://en.wikipedia.org/wiki/King%27s_Indian_Defence"
      - square: f4
        role: outpost
        for_color: black
        rationale: "Mar del Plata kingside anchor — ...f5-f4 spearheads ...g5-g4 with mating ideas vs castled king."
        source_url: "https://en.wikipedia.org/wiki/King%27s_Indian_Defence"
      - square: e4
        role: control
        for_color: white
        rationale: "Structural pivot — whoever controls e4 dictates the wing-attack tempo; both sides fight for it."
        source_url: "https://en.wikipedia.org/wiki/King%27s_Indian_Defence"
